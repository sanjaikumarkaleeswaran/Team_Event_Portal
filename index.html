<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Event Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1 id="site-title">Team Event Portal</h1>
    <p id="tagline">Find a learning event for your team.</p>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#events">Events</a>
      <a href="#register">Register</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section id="home" class="panel">
      <h2>Welcome</h2>
      <p>Practice Git collaboration by improving this small event website.</p>
    </section>
    <section id="events" class="panel">
      <h2>Upcoming Events</h2>
      <div id="event-list" class="event-grid" aria-live="polite"></div>
    </section>
    <section id="register" class="panel">
      <h2>Register</h2>
      <p id="registration-message">Registration form coming soon.</p>
    </section>
    <section id="contact" class="panel">
      <h2>Contact</h2>
      <p id="contact-details">Contact details coming soon.</p>
    </section>
  </main>
  <footer><p id="footer-note">Built by our Git training team.</p></footer>
</body>
</html>
